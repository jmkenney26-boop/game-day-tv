name: Build the TV app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # A stable signing key, saved in the repository's Actions cache, so each new build installs as an
      # update over the last one (instead of "app not installed").
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: game-day-debug-keystore-v1

      - name: Build
        run: gradle :app:assembleRelease --stacktrace

      - name: Name the app file
        run: cp app/build/outputs/apk/release/app-release.apk GameDayTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GameDayTV
          path: GameDayTV.apk

      # Also attach it to a "latest" release: one place to download the newest build.
      - name: Publish as the latest build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Game Day TV (latest build)
          body: "Build ${{ github.run_number }} from ${{ github.sha }}. Install GameDayTV.apk on the Shield / VSeeBox."
          files: GameDayTV.apk
          prerelease: false
          make_latest: true
