plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gameday.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gameday.tv'
        minSdk 23
        targetSdk 33
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "0.1." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so it installs straight onto the box (sideloading).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Runs the tile script in every frame of a page, including players embedded from other sites.
    implementation 'androidx.webkit:webkit:1.11.0'
}
